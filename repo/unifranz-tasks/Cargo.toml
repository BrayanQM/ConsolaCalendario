[package]
name = "unifranz-tasks"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde", "clock"] }
crossterm = { version = "0.28", features = ["event-stream"] }
dirs = "5.0"
ical = "0.11"
open = "5.3"
ratatui = "0.29"
regex = "1.10"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
tui-textarea = "0.7"
unicode-width = "0.2"
url = "2.5"

[lib]
name = "unifranz_tasks"
path = "src/lib.rs"
